<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chúc clan ngủ ngon · BOT ANWLOP</title>
  <style>
    :root {
      --pink: #ff8fb8;
      --pink-light: #ffd4e5;
      --lavender: #c5b8ff;
      --ink: #33294d;
      --night: #171637;
      --night-2: #282457;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: white;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 42%, rgba(134, 114, 223, .26), transparent 30%),
        radial-gradient(circle at 10% 0%, rgba(255, 145, 190, .16), transparent 24%),
        linear-gradient(145deg, var(--night), var(--night-2) 55%, #171733);
    }

    .scene {
      position: relative;
      width: min(100vw, 980px);
      height: min(100vh, 760px);
      min-height: 560px;
      isolation: isolate;
      overflow: hidden;
    }

    .moon {
      position: absolute;
      top: 8%;
      right: 12%;
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: #fff5c8;
      box-shadow: 0 0 0 14px rgba(255, 245, 200, .06), 0 0 42px rgba(255, 232, 167, .42);
    }

    .moon::after {
      content: "";
      position: absolute;
      width: 74px;
      height: 74px;
      top: -6px;
      left: 19px;
      border-radius: 50%;
      background: var(--night-2);
    }

    .stars, .stars::before, .stars::after {
      position: absolute;
      inset: 0;
      content: "";
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 0 1px, transparent 1.8px),
        radial-gradient(circle, rgba(255,211,230,.8) 0 1px, transparent 1.8px),
        radial-gradient(circle, rgba(255,244,190,.8) 0 1.2px, transparent 2px);
      background-size: 137px 151px, 211px 193px, 263px 221px;
      background-position: 18px 25px, 80px 11px, 41px 98px;
      opacity: .66;
      z-index: -1;
    }

    .stars::before {
      transform: translate(74px, 32px);
      opacity: .42;
    }

    .stars::after {
      transform: translate(-48px, 96px);
      opacity: .28;
    }

    .cloud {
      position: absolute;
      width: 185px;
      height: 36px;
      border-radius: 100px;
      background: rgba(255,255,255,.11);
      filter: blur(.2px);
      opacity: .7;
    }

    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      bottom: 5px;
      border-radius: 50%;
      background: inherit;
    }

    .cloud::before { width: 70px; height: 70px; left: 24px; }
    .cloud::after { width: 94px; height: 94px; right: 23px; }
    .cloud.one { left: -38px; top: 21%; transform: scale(.75); }
    .cloud.two { right: -44px; top: 32%; transform: scale(.62); opacity: .45; }
    .cloud.three { left: 7%; bottom: 13%; transform: scale(.55); opacity: .36; }

    .intro {
      position: absolute;
      z-index: 4;
      top: 6%;
      left: 0;
      right: 0;
      text-align: center;
      animation: floatTitle 4s ease-in-out infinite;
      pointer-events: none;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--pink-light);
      font-size: clamp(11px, 2vw, 14px);
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      opacity: .86;
    }

    h1 {
      margin: 0;
      font-size: clamp(23px, 4.3vw, 42px);
      line-height: 1.05;
      letter-spacing: .02em;
      text-shadow: 0 4px 16px rgba(0,0,0,.2);
    }

    .sky {
      position: absolute;
      inset: 0;
      top: 11%;
      bottom: 11%;
    }

    .orbit {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 390px;
      height: 280px;
      transform: translate(-50%, -50%);
      border: 1px dashed rgba(255, 202, 226, .18);
      border-radius: 50%;
      box-shadow: 0 0 80px rgba(197, 184, 255, .08);
    }

    .orbit::before, .orbit::after {
      content: "";
      position: absolute;
      inset: 28px -50px;
      border: 1px dashed rgba(255, 202, 226, .1);
      border-radius: 50%;
      transform: rotate(34deg);
    }

    .orbit::after {
      inset: -42px 56px;
      transform: rotate(-45deg);
    }

    #planes {
      position: absolute;
      inset: 0;
    }

    .plane {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 43px;
      height: 30px;
      transform-origin: 50% 50%;
      filter: drop-shadow(0 7px 5px rgba(5, 3, 31, .32));
      will-change: transform, opacity;
      transition: filter .8s ease;
    }

    .plane svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .plane .trail {
      position: absolute;
      width: 60px;
      height: 13px;
      left: -35px;
      top: 12px;
      border-top: 2px dotted rgba(255, 207, 231, .46);
      transform: rotate(18deg);
      opacity: .7;
    }

    .heart-glow {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 185px;
      height: 165px;
      transform: translate(-50%, -47%) scale(.1);
      opacity: 0;
      border-radius: 45%;
      background: rgba(255, 117, 173, .2);
      filter: blur(23px);
      transition: transform 1.6s cubic-bezier(.2,.8,.2,1), opacity 1.5s ease;
    }

    .scene.complete .heart-glow {
      transform: translate(-50%, -47%) scale(1.08);
      opacity: 1;
      animation: pulse 2.3s ease-in-out 1.6s infinite;
    }

    .message {
      position: absolute;
      z-index: 5;
      left: 0;
      right: 0;
      bottom: 8%;
      text-align: center;
      opacity: 0;
      transform: translateY(15px) scale(.97);
      transition: opacity 1.2s ease, transform 1.2s cubic-bezier(.2,.8,.2,1);
      pointer-events: none;
    }

    .complete .message {
      opacity: 1;
      transform: translateY(0) scale(1);
      transition-delay: .75s;
    }

    .message p {
      margin: 0;
      color: #fff7fb;
      font-size: clamp(20px, 4vw, 35px);
      font-weight: 800;
      text-shadow: 0 3px 18px rgba(255, 105, 165, .48);
    }

    .message small {
      display: block;
      margin-top: 9px;
      color: var(--pink-light);
      font-size: clamp(11px, 2vw, 15px);
      letter-spacing: .15em;
      font-weight: 700;
    }

    .replay {
      position: absolute;
      z-index: 10;
      right: 22px;
      bottom: 20px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 999px;
      padding: 10px 15px;
      color: #fff;
      background: rgba(255,255,255,.1);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background .2s ease, transform .2s ease;
    }

    .replay:hover { background: rgba(255,143,184,.25); transform: translateY(-2px); }
    .replay:active { transform: translateY(0); }

    @keyframes floatTitle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -47%) scale(1.02); opacity: .72; }
      50% { transform: translate(-50%, -47%) scale(1.18); opacity: 1; }
    }

    @media (max-width: 600px) {
      .scene { min-height: 520px; }
      .moon { top: 7%; right: 7%; width: 58px; height: 58px; }
      .moon::after { width: 53px; height: 53px; left: 13px; top: -5px; }
      .orbit { width: 285px; height: 220px; }
      .plane { width: 36px; height: 25px; }
      .message { bottom: 9%; padding: 0 18px; }
      .replay { right: 12px; bottom: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .intro { animation: none; }
      .plane { transition: transform 1.5s ease, opacity 1s ease; }
      .scene.complete .heart-glow { animation: none; }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene">
    <div class="stars"></div>
    <div class="moon" aria-hidden="true"></div>
    <div class="cloud one" aria-hidden="true"></div>
    <div class="cloud two" aria-hidden="true"></div>
    <div class="cloud three" aria-hidden="true"></div>

    <header class="intro">
      <p class="eyebrow">một chuyến bay nhỏ trước giờ đi ngủ</p>
      <h1>🌙 Gửi cả clan thân yêu 🌙</h1>
    </header>

    <section class="sky" aria-label="Hoạt cảnh những chiếc máy bay giấy">
      <div class="orbit" aria-hidden="true"></div>
      <div class="heart-glow" aria-hidden="true"></div>
      <div id="planes"></div>
    </section>

    <section class="message" aria-live="polite">
      <p>Chúc clan ngủ ngon nhé, mãi yêu 💗</p>
      <small>— BOT ANWLOP —</small>
    </section>

    <button class="replay" id="replay" type="button">↻ Bay lại lần nữa</button>
  </main>

  <script>
    const scene = document.getElementById("scene");
    const planesRoot = document.getElementById("planes");
    const replay = document.getElementById("replay");
    const totalPlanes = 14;
    const startTime = performance.now();
    let animationId;
    let runStartedAt = startTime;

    const colors = [
      ["#fff8fc", "#ffacd0"],
      ["#f4f0ff", "#c6b9ff"],
      ["#fff8d8", "#ffd58d"],
      ["#ffffff", "#a9e9e2"]
    ];

    // Vị trí tạo thành một trái tim khi các máy bay dừng lại.
    function heartPoint(t, scale) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x: x * scale, y: y * scale };
    }

    function planeMarkup(index) {
      const [light, shade] = colors[index % colors.length];
      return `
        <span class="trail"></span>
        <svg viewBox="0 0 100 70" role="img" aria-label="Máy bay giấy">
          <path d="M5 31 L94 5 L58 64 L48 39 Z" fill="${light}" stroke="rgba(255,255,255,.9)" stroke-width="2"/>
          <path d="M5 31 L48 39 L94 5" fill="none" stroke="${shade}" stroke-width="2.5"/>
          <path d="M48 39 L58 64" fill="none" stroke="${shade}" stroke-width="2.5"/>
          <path d="M48 39 L73 25" fill="none" stroke="rgba(104,75,139,.28)" stroke-width="2"/>
        </svg>`;
    }

    const planes = Array.from({ length: totalPlanes }, (_, index) => {
      const el = document.createElement("div");
      el.className = "plane";
      el.innerHTML = planeMarkup(index);
      planesRoot.appendChild(el);
      return {
        el,
        index,
        angle: (Math.PI * 2 * index) / totalPlanes,
        orbit: 0.78 + (index % 4) * 0.1,
        speed: 0.0009 + (index % 5) * 0.0001,
        delay: (index % 4) * 65
      };
    });

    function easeInOut(t) {
      return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    function render(now) {
      const elapsed = now - runStartedAt;
      const flyDuration = 7600;
      const assembleDuration = 2500;
      const assembleStart = flyDuration;
      const centerX = window.innerWidth < 600 ? 0 : 0;
      const centerY = window.innerWidth < 600 ? 2 : 0;
      const isAssembling = elapsed >= assembleStart;
      const assembleProgress = Math.min(1, Math.max(0, (elapsed - assembleStart) / assembleDuration));
      const heartScale = window.innerWidth < 600 ? 4.55 : 5.7;

      planes.forEach((plane, index) => {
        let x, y, rotation, scale, opacity = 1;
        const orbitTime = elapsed + plane.delay;

        // Bay nhiều vòng theo các quỹ đạo lệch nhau.
        const loop = plane.angle + orbitTime * plane.speed;
        const radiusX = (142 + (index % 4) * 27) * plane.orbit;
        const radiusY = (90 + (index % 3) * 22) * plane.orbit;
        const wobble = Math.sin(orbitTime * .002 + index) * 8;

        x = Math.cos(loop) * radiusX;
        y = Math.sin(loop) * radiusY + wobble;
        rotation = (Math.atan2(Math.sin(loop) * radiusY, Math.cos(loop) * radiusX) * 180 / Math.PI) + 34;
        scale = .78 + (Math.sin(orbitTime * .0023 + index) + 1) * .08;

        if (isAssembling) {
          const t = (index / totalPlanes) * Math.PI * 2 + .08;
          const target = heartPoint(t, heartScale);
          // Các máy bay vào trái tim từ nhiều hướng, tạo cảm giác hội tụ mềm mại.
          const progress = easeInOut(Math.min(1, (assembleProgress + index * .018)));
          x = x * (1 - progress) + target.x * progress + centerX;
          y = y * (1 - progress) + target.y * progress + centerY;
          rotation = rotation * (1 - progress) + (target.x > 0 ? target.y * .35 : -target.y * .35) * progress;
          scale = scale * (1 - progress) + .72 * progress;
          if (assembleProgress > .82) opacity = 1 - Math.max(0, assembleProgress - .92) * 3;
        }

        plane.el.style.transform =
          `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(${rotation}deg) scale(${scale})`;
        plane.el.style.opacity = opacity;
      });

      if (assembleProgress >= 1) scene.classList.add("complete");
      animationId = requestAnimationFrame(render);
    }

    function restart() {
      cancelAnimationFrame(animationId);
      scene.classList.remove("complete");
      runStartedAt = performance.now();
      animationId = requestAnimationFrame(render);
    }

    replay.addEventListener("click", restart);
    animationId = requestAnimationFrame(render);
  </script>
</body>
</html>
