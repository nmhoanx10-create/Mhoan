<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minh Hoàn — Security Screen</title>
  <style>
    :root {
      --green: #00ff66;
      --green-soft: #79ffad;
      --black: #020604;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--black);
      color: var(--green);
      font-family: "Courier New", Courier, monospace;
    }

    body::after {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      content: "";
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.025) 0,
        rgba(255, 255, 255, 0.025) 1px,
        transparent 1px,
        transparent 4px
      );
      mix-blend-mode: screen;
    }

    #matrix {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
      opacity: 0.78;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at center, transparent 25%, rgba(0, 0, 0, 0.35) 75%, rgba(0, 0, 0, 0.8) 100%),
        linear-gradient(90deg, rgba(0, 255, 102, 0.03), transparent 35%, transparent 65%, rgba(0, 255, 102, 0.03));
    }

    .corner-label {
      position: fixed;
      top: 22px;
      right: 26px;
      z-index: 4;
      padding: 9px 14px;
      border: 1px solid rgba(0, 255, 102, 0.58);
      border-radius: 4px;
      color: var(--green-soft);
      font-size: clamp(12px, 1.5vw, 16px);
      letter-spacing: 0.18em;
      text-transform: lowercase;
      text-shadow: 0 0 8px var(--green);
      background: rgba(0, 20, 8, 0.56);
      box-shadow: 0 0 16px rgba(0, 255, 102, 0.16), inset 0 0 12px rgba(0, 255, 102, 0.08);
    }

    .corner-label::before {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 9px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 9px var(--green);
      content: "";
      animation: pulse 1.2s ease-in-out infinite;
    }

    .content {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      padding: 24px;
      text-align: center;
    }

    .message {
      width: min(900px, 94vw);
      padding: clamp(28px, 6vw, 70px) clamp(20px, 6vw, 72px);
      border: 1px solid rgba(0, 255, 102, 0.5);
      border-radius: 8px;
      background: linear-gradient(145deg, rgba(0, 26, 10, 0.76), rgba(0, 6, 2, 0.78));
      box-shadow:
        0 0 20px rgba(0, 255, 102, 0.14),
        0 0 80px rgba(0, 255, 102, 0.06),
        inset 0 0 32px rgba(0, 255, 102, 0.045);
      animation: appear 1.2s ease-out both;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--green-soft);
      font-size: clamp(11px, 1.7vw, 15px);
      letter-spacing: 0.28em;
      opacity: 0.8;
    }

    h1 {
      margin: 0;
      color: var(--green);
      font-size: clamp(27px, 6vw, 72px);
      line-height: 1.12;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-shadow:
        0 0 5px var(--green),
        0 0 20px rgba(0, 255, 102, 0.8),
        0 0 48px rgba(0, 255, 102, 0.38);
      animation: flicker 4s infinite;
    }

    .cursor {
      display: inline-block;
      width: 0.58em;
      height: 1em;
      margin-left: 0.16em;
      vertical-align: -0.12em;
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
      animation: blink 0.8s steps(1) infinite;
    }

    .status {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      margin-top: 31px;
      padding: 10px 16px;
      border: 1px solid rgba(0, 255, 102, 0.28);
      color: rgba(182, 255, 207, 0.9);
      font-size: clamp(10px, 1.4vw, 13px);
      letter-spacing: 0.16em;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
      animation: pulse 1s infinite;
    }

    .goodnight {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(1, 8, 4, 0.9);
      opacity: 0;
      pointer-events: none;
      text-align: center;
      transition: opacity 0.8s ease;
    }

    .goodnight.show {
      opacity: 1;
    }

    .goodnight-card {
      width: min(720px, 92vw);
      padding: clamp(36px, 7vw, 72px) 24px;
      border: 1px solid rgba(0, 255, 102, 0.45);
      border-radius: 10px;
      background: linear-gradient(145deg, rgba(0, 29, 12, 0.9), rgba(1, 10, 5, 0.94));
      box-shadow: 0 0 42px rgba(0, 255, 102, 0.18), inset 0 0 30px rgba(0, 255, 102, 0.05);
      transform: translateY(14px) scale(0.97);
      transition: transform 0.8s ease;
    }

    .goodnight.show .goodnight-card {
      transform: translateY(0) scale(1);
    }

    .moon {
      display: block;
      margin-bottom: 20px;
      color: #c7ffda;
      font-family: Arial, sans-serif;
      font-size: clamp(34px, 7vw, 64px);
      text-shadow: 0 0 18px rgba(199, 255, 218, 0.8);
    }

    .goodnight h2 {
      margin: 0;
      color: var(--green-soft);
      font-size: clamp(30px, 7vw, 68px);
      letter-spacing: 0.08em;
      text-shadow: 0 0 12px var(--green), 0 0 32px rgba(0, 255, 102, 0.5);
    }

    .goodnight p {
      margin: 22px 0 0;
      color: rgba(190, 255, 211, 0.78);
      font-size: clamp(11px, 1.8vw, 15px);
      letter-spacing: 0.14em;
    }

    @keyframes appear {
      from { opacity: 0; transform: scale(0.97) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes flicker {
      0%, 18%, 22%, 63%, 100% { opacity: 1; }
      20%, 21%, 62% { opacity: 0.72; }
    }

    @keyframes blink {
      0%, 45% { opacity: 1; }
      46%, 100% { opacity: 0; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.75); }
    }

    @media (max-width: 600px) {
      .corner-label {
        top: 14px;
        right: 14px;
        padding: 7px 10px;
        letter-spacing: 0.1em;
      }

      .message {
        padding-top: 50px;
        padding-bottom: 50px;
      }
    }
  </style>
</head>
<body>
  <canvas id="matrix" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <div class="corner-label">minh hoàn</div>

  <main class="content">
    <section class="message" aria-label="Thông báo">
      <p class="eyebrow">/// SYSTEM ALERT ///</p>
      <h1>Xin Chúc Mừng<br />Bạn Đã Bị Hack<span class="cursor"></span></h1>
      <div class="status">
        <span class="status-dot"></span>
        KẾT NỐI ĐANG ĐƯỢC GIÁM SÁT
      </div>
    </section>
  </main>

  <section class="goodnight" id="goodnight" aria-live="polite" aria-hidden="true">
    <div class="goodnight-card">
      <span class="moon">☾ ✦</span>
      <h2>Chúc ngủ ngon</h2>
      <p>HỆ THỐNG ĐÃ CHUYỂN SANG CHẾ ĐỘ NGỦ</p>
    </div>
  </section>

  <script>
    const canvas = document.getElementById("matrix");
    const context = canvas.getContext("2d");
    const goodnight = document.getElementById("goodnight");
    const characters = "0123456789ABCDEF<>[]{}#$%&@";
    let columns = 0;
    let drops = [];
    let fontSize = 16;
    let hasShownGoodnight = false;

    function resizeCanvas() {
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * pixelRatio;
      canvas.height = window.innerHeight * pixelRatio;
      canvas.style.width = `${window.innerWidth}px`;
      canvas.style.height = `${window.innerHeight}px`;
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

      fontSize = Math.max(13, Math.min(20, window.innerWidth / 85));
      columns = Math.ceil(window.innerWidth / fontSize);
      drops = Array.from({ length: columns }, () => Math.random() * -80);
    }

    function drawMatrix() {
      context.fillStyle = "rgba(2, 6, 4, 0.105)";
      context.fillRect(0, 0, window.innerWidth, window.innerHeight);
      context.font = `${fontSize}px "Courier New", monospace`;

      for (let index = 0; index < drops.length; index += 1) {
        const character = characters[Math.floor(Math.random() * characters.length)];
        const x = index * fontSize;
        const y = drops[index] * fontSize;
        const glow = Math.random() > 0.88;

        context.fillStyle = glow ? "#c4ffdb" : "#00d95a";
        context.shadowColor = "#00ff66";
        context.shadowBlur = glow ? 9 : 3;
        context.fillText(character, x, y);
        context.shadowBlur = 0;

        if (y > window.innerHeight && Math.random() > 0.975) {
          drops[index] = Math.random() * -25;
        } else {
          drops[index] += 0.55 + Math.random() * 0.5;
        }
      }
      requestAnimationFrame(drawMatrix);
    }

    window.addEventListener("resize", resizeCanvas);
    document.addEventListener("pointerdown", () => {
      if (hasShownGoodnight) return;
      hasShownGoodnight = true;
      goodnight.classList.add("show");
      goodnight.setAttribute("aria-hidden", "false");
    }, { once: true });

    resizeCanvas();
    drawMatrix();
  </script>
</body>
</html>
